name: Mode Chat Release (Windows)

on:
  push:
    branches: [main]
    # 只改文档 / 图标许可 / 忽略文件时不需要发版，否则每推一次就多一个 patch 版本。
    # 要发版就改代码，或用 workflow_dispatch 显式指定版本。
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"
      - "assets/icons/LICENSE*"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "可选：指定版本号（不带 v）。留空则取最近 tag 的 patch + 1。"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mode-chat-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: windows-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # 三道文档/UI 门禁：任一 scripts 非 0 退出就这里失败，挡住发版。
      # 对外部对照树（DS-Bot 基线、pi-rust checkout）的锚点脚本会自动跳过并计数，
      # 不设置 MODE_PARITY_*_ROOT 时只校验仓库自己的文件。
      - name: UI design-token gate
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\ui-lint.ps1 -Enforce
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verify parity anchors
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\verify-parity-anchors.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verify architecture anchors
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\verify-arch-anchors.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=""
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            # push main 与 push tag 会各触发一次（concurrency 串行，但都会跑完）。
            # 若当前提交本身已被打上 v* tag，就用那个版本，别再算 patch+1，
            # 否则同一次发版会多出一个 patch Release（v0.5.0 + v0.5.1）。
            on_head="$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -n1 || true)"
            if [ -n "$on_head" ]; then
              version="${on_head#v}"
              echo "HEAD 已带 tag $on_head，按该版本发版"
            else
              latest="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
              if [ -z "$latest" ]; then
                version="0.1.0"
              else
                base="${latest#v}"
                major="${base%%.*}"
                rest="${base#*.}"
                minor="${rest%%.*}"
                patch="${rest#*.}"
                version="${major}.${minor}.$((patch + 1))"
              fi
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Mode Chat version: $version"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/package-mode-chat.mjs --version="$VERSION" --require-installer

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: dist/mode-chat/ModeChat-v${{ steps.version.outputs.version }}-windows-x64.zip
          SETUP: dist/mode-chat/ModeChat-v${{ steps.version.outputs.version }}-setup.exe
          MANIFEST: dist/mode-chat/gpui-latest.json
        run: |
          set -euo pipefail
          for file in "$ZIP" "$SETUP" "$MANIFEST"; do
            test -f "$file" || { echo "::error::missing $file"; exit 1; }
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SETUP" "$MANIFEST" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SETUP" "$MANIFEST" \
              --target "$GITHUB_SHA" \
              --title "Mode Chat v${VERSION}" \
              --notes "Mode Chat v${VERSION}（Rust + GPUI，内嵌 pi-rust 引擎）" \
              --latest
          fi

name: Mode Chat Release (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "可选：指定版本号（不带 v）。留空则取最近 tag 的 patch + 1。"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mode-chat-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: windows-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=""
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            latest="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
            if [ -z "$latest" ]; then
              version="0.1.0"
            else
              base="${latest#v}"
              major="${base%%.*}"
              rest="${base#*.}"
              minor="${rest%%.*}"
              patch="${rest#*.}"
              version="${major}.${minor}.$((patch + 1))"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Mode Chat version: $version"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/package-mode-chat.mjs --version="$VERSION" --require-installer

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: dist/mode-chat/ModeChat-v${{ steps.version.outputs.version }}-windows-x64.zip
          SETUP: dist/mode-chat/ModeChat-v${{ steps.version.outputs.version }}-setup.exe
          MANIFEST: dist/mode-chat/gpui-latest.json
        run: |
          set -euo pipefail
          for file in "$ZIP" "$SETUP" "$MANIFEST"; do
            test -f "$file" || { echo "::error::missing $file"; exit 1; }
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SETUP" "$MANIFEST" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SETUP" "$MANIFEST" \
              --target "$GITHUB_SHA" \
              --title "Mode Chat v${VERSION}" \
              --notes "Mode Chat v${VERSION}（Rust + GPUI，内嵌 pi-rust 引擎）" \
              --latest
          fi

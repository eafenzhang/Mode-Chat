name: Mode Chat Release (Windows)

on:
  # 只在打 tag 时发版。
  #
  # 以前是「push main 也发版，用 paths-ignore 挡文档改动」，那条路挡不住一切：
  # v0.6.1 就是 push main（只改了 `scripts/shot-probe.ps1`）自动算出 patch+1 发出的，
  # 于是出现了一个「只有文档与自查脚本变化」的版本。
  # 白名单式的 paths-ignore 只能挡住列出来的目录，新目录一出现就漏；而且
  # 「src 改了但没打算发版」这种情况它根本表达不了（v0.6.0 之后 main 上的引用条就是）。
  #
  # 现在：**发版 = 打 tag**。push main 只跑 CI（`anchor-gate.yml`），不发版。
  # 要发版就 `git tag v0.x.y && git push chat v0.x.y`；手动发版走 workflow_dispatch。
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "可选：指定版本号（不带 v）。留空则取最近 tag 的 patch + 1。"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mode-chat-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: windows-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test
        # `--workspace`：CI 原来写的是 `cargo test --locked`，只跑默认成员，不是全 workspace。
        # `--no-fail-fast`：cargo 默认在第一个失败的 target 处停止，后面的 crate 一个都不跑。
        #   实测本仓锁屏时 bot-gpui-pilot 第一个失败 -> 只跑了 13/37 个 test binary、
        #   passed 合计 225（真实 573），而 PRD 的判据写的是 total = 577。
        #   失败时总数取决于 cargo 的 crate 执行顺序，顺序不在我们手里，所以必须显式关掉 fail-fast，
        #   让「total = 577」在任何失败场景下都成立。
        run: cargo test --workspace --locked --no-fail-fast

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # 三道文档/UI 门禁：任一 scripts 非 0 退出就这里失败，挡住发版。
      # 对外部对照树（DS-Bot 基线、pi-rust checkout）的锚点脚本会自动跳过并计数，
      # 不设置 MODE_PARITY_*_ROOT 时只校验仓库自己的文件。
      - name: UI design-token gate
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\ui-lint.ps1 -Enforce
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verify parity anchors
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\verify-parity-anchors.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verify architecture anchors
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\verify-arch-anchors.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=""
          # 仓库里声明的版本（`[package].version`）。
          #
          # 必须读 `[package]` 段，不能 `head -n1` 取第一个 `version = "..."`：
          # Cargo.toml 里 `[workspace.package]` 也有一个 `version`，而且排在上面。
          # 而 exe 的 `CARGO_PKG_VERSION` 读的是**当前包的** `[package].version`。
          # 取错段会让这条校验在「两个值碰巧相同」时放行、在「只改了一个」时误拦截，
          # 也就是判据没有分辨力。
          cargo_version="$(awk '/^\[package\]/{f=1} f && /^version = "/{gsub(/^version = "|"$/,""); print; exit}' Cargo.toml)"
          # 语义化比较：a 大于 b 时返回 0（true）。
          newer_than() {
            local a="$1" b="$2"
            [ "$a" = "$b" ] && return 1
            local IFS=.
            local -a av bv
            read -r -a av <<< "$a"
            read -r -a bv <<< "$b"
            for i in 0 1 2; do
              local x="${av[$i]:-0}" y="${bv[$i]:-0}"
              if [ "$x" -gt "$y" ] 2>/dev/null; then return 0; fi
              if [ "$x" -lt "$y" ] 2>/dev/null; then return 1; fi
            done
            return 1
          }
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            # 只有 workflow_dispatch 且没填版本时走到这里（push 已经只在 tag 上触发了）。
            # 若当前提交本身已被打上 v* tag，就用那个版本，别再算 patch+1，
            # 否则同一次发版会多出一个 patch Release（v0.5.0 + v0.5.1）。
            on_head="$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -n1 || true)"
            if [ -n "$on_head" ]; then
              version="${on_head#v}"
              echo "HEAD 已带 tag $on_head，按该版本发版"
            else
              latest="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
              if [ -z "$latest" ]; then
                version="0.1.0"
              else
                base="${latest#v}"
                major="${base%%.*}"
                rest="${base#*.}"
                minor="${rest%%.*}"
                patch="${rest#*.}"
                version="${major}.${minor}.$((patch + 1))"
              fi
              # 已经手工升过版本就听 Cargo.toml 的，别发一个更旧的 patch 号。
              if [ -n "$cargo_version" ] && newer_than "$cargo_version" "$version"; then
                echo "Cargo.toml 版本 $cargo_version 高于推算的 $version，按 Cargo.toml 发版"
                version="$cargo_version"
              fi
            fi
          fi
          # 版本号必须与 Cargo.toml 同源。
          #
          # 包里的版本是构建期注入的（`package-mode-chat.mjs --version=...` 写 MODE_BOT_VERSION），
          # 源码里的版本是 Cargo.toml 的 [package].version。两者不一致时，「从 tag 重建」
          # 会得到另一个版本号，这个包就不可复现。
          #
          # v0.6.1 就是这类事故：tag v0.6.1 → 02bb019，那个提交里 Cargo.toml 仍是 0.6.0，
          # 包自报 0.6.1。该版本**已发布、不撤**（撤了会留下指向它的 tag 与已升级的客户端），
          # 由后续版本把版本号对齐。这道校验是为了不再产生第二个。
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::版本号与源码不一致：本次要发 v$version，Cargo.toml 里是 ${cargo_version:-（读不到）}。"
            echo "::error::请先把 Cargo.toml 的 [package].version 改成 $version 再发版，否则从 tag 重建会得到 ${cargo_version:-另一个} 的包。"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Mode Chat version: $version (Cargo.toml: ${cargo_version:-unknown})"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/package-mode-chat.mjs --version="$VERSION" --require-installer

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: dist/mode-chat/ModeChat-v${{ steps.version.outputs.version }}-windows-x64.zip
          SETUP: dist/mode-chat/ModeChat-v${{ steps.version.outputs.version }}-setup.exe
          MANIFEST: dist/mode-chat/gpui-latest.json
        run: |
          set -euo pipefail
          for file in "$ZIP" "$SETUP" "$MANIFEST"; do
            test -f "$file" || { echo "::error::missing $file"; exit 1; }
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SETUP" "$MANIFEST" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SETUP" "$MANIFEST" \
              --target "$GITHUB_SHA" \
              --title "Mode Chat v${VERSION}" \
              --notes "Mode Chat v${VERSION}（Rust + GPUI，内嵌 pi-rust 引擎）" \
              --latest
          fi

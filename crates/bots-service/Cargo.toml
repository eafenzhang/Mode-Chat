[package]
name = "bots-service"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Bot（IM 机器人）数据层：bot-config.v3/bot-bindings.v3/bot-state 文件与访问控制管理（botsService 管理面移植）"

[lib]
name = "bots_service"
path = "src/lib.rs"

[dependencies]
atomic-file = { path = "../atomic-file" }
model-selection = { path = "../model-selection" }
sha2 = { workspace = true }
regex = "1"
uuid.workspace = true
base64.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
